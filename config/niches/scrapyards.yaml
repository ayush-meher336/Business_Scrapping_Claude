niche: scrapyards
display_name: Scrapyards and scrap industry (ScrapTrade)

# Values must exist in the workbook's Lists tab ("Industry Type" column).
industry_enum: Industry Type
material_enum: Material Focus

categories:
  include:
    - Scrap Yard / Metal Recycler
    - Scrap Collector / Aggregator
    - Scrap Buyer / Trader
    - Scrap Exporter
    - Scrap Importer
    - Auto Dismantler / Wrecker
    - E-Waste Recycler
    - Battery / Lead Recycler
  optional:            # switch on per run
    - Steel Mill / Foundry / Smelter
    - Paper & Cardboard Recycler
    - Plastics Recycler
    - Demolition Contractor
    - Waste Management Company
    - Manufacturer (Industrial Scrap Generator)
    - Mining / Resources (Scrap Generator)
    - Shipbreaker
    - Tyre / Rubber Recycler
    - Textile Recycler
  exclude: []

keyword_packs:
  en:
    language: en
    core: [scrap metal, scrap yard, metal recycling, scrap metal buyer, scrap merchant, scrap dealer]
    synonyms: [scrapyard, metal recycling centre, car wreckers, auto dismantler, vehicle salvage yard]
    materials: [copper scrap buyer, aluminium scrap, brass scrap, steel scrap, ferrous scrap, non-ferrous scrap, e-waste recycling, battery recycling]
    exclusions: [scrapbooking, scrap paper craft]
  hi:
    language: hi
    core: [kabadiwala, bhangarwala, कबाड़ी, स्क्रैप डीलर]
    synonyms: [कबाड़ खरीदार]

qualification:
  relevant_if: Buys, processes, trades, exports or imports scrap or recyclable materials, or generates industrial scrap in volume.
  irrelevant_if: Only sells new metal products, only removes rubbish without recycling, or is a craft/hobby business.

description:
  must_mention: [materials handled, services, customer types, operating location]
  max_words: 60
  hook_max_words: 25

enrichment:
  max_pages: 5
  domain_budget_s: 20
  page_keywords: [contact, about, materials, we buy, prices, services, locations]

sources:
  # No third-party APIs: Google Maps and web search are driven through SeleniumBase;
  # company websites and association directories are fetched over plain HTTP.
  prefer: [google_maps_browser, web_search_browser, association_directories, company_websites]
  disable: []

# Leads tab layout: 39 legacy columns (order preserved) then the new columns.
# owner: research = written by sync unless a human edited it; sales = never overwritten;
# shared_append = auto lines appended only; computed = written from database logic.
sheet_columns:
  - {header: "Lead ID", field: lead_id, owner: computed}
  - {header: "Region", field: region, owner: research}
  - {header: "Country", field: country, owner: research}
  - {header: "State / Province", field: state_province, owner: research}
  - {header: "City", field: city, owner: research}
  - {header: "Suburb / Area", field: suburb_area, owner: research}

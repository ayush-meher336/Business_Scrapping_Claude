[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadforge"
version = "0.1.0"
description = "Global business discovery, lead research and AI-assisted enrichment"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "seleniumbase>=4.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.9",
    "tldextract>=5.1",
    "trafilatura>=1.12",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leadforge = "leadforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadforge = ["storage/*.sql", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
